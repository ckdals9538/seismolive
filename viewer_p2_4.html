<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SEISMOLIVE — P2.4 Dynamic Route Replanning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #020408;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Nanum Myeongjo", serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #header-overlay {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
    }
    .title {
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f8fafc;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #94a3b8;
    }
    .badge-replan {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid #f59e0b;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #fbbf24;
      text-transform: uppercase;
      margin-left: 6px;
    }
    .badge-provisional {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid #475569;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* Minimal Editorial Guidance Strip (Bottom-Left) */
    #guidance-container {
      position: absolute;
      bottom: 28px;
      left: 32px;
      max-width: 680px;
      z-index: 10;
      pointer-events: none;
      background: rgba(2, 4, 8, 0.90);
      border-left: 2px solid #e2e8f0;
      padding: 16px 20px;
      backdrop-filter: blur(8px);
    }
    .guidance-phase {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .guidance-headline {
      font-size: 15px;
      letter-spacing: 0.04em;
      color: #ffffff;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .guidance-primary {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .guidance-warning {
      font-size: 11px;
      color: #fb7185;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .guidance-meta {
      font-size: 10px;
      color: #64748b;
      letter-spacing: 0.04em;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meta-row {
      display: flex;
      gap: 16px;
    }

    /* Minimal Legend (Top-Right) */
    #legend-box {
      position: absolute;
      top: 24px;
      right: 32px;
      z-index: 10;
      background: rgba(10, 14, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      font-size: 10.5px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-line {
      width: 18px;
      height: 2px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="header-overlay">
    <div class="title" id="view-title">SEISMOLIVE · DYNAMIC ROUTE REPLANNING</div>
    <div class="subtitle" id="view-subtitle">Phase P2.4: Real-time Link Obstacle Rerouting · Multi-Criteria Dijkstra</div>
  </div>

  <div id="legend-box">
    <div class="legend-item"><span class="legend-line" style="background:#f8fafc;"></span> <span>최단 경로 (651.9m)</span></div>
    <div class="legend-item"><span class="legend-line" style="background:#f59e0b;"></span> <span>폐쇄/위험 계단 (CLOSED)</span></div>
    <div class="legend-item"><span class="legend-line" style="background:#38bdf8;"></span> <span>동적 우회로 (769.1m STEP-FREE)</span></div>
  </div>

  <div id="guidance-container">
    <div class="guidance-phase">
      <span id="ui-phase-badge">동적 재탐색 연동</span>
      <span class="badge-replan" id="ui-replan-badge">REPLANNED</span>
      <span class="badge-provisional" id="ui-provisional-tag">PROVISIONAL 후보로</span>
    </div>
    <div class="guidance-headline" id="ui-headline">상황 분석 대기 중...</div>
    <div class="guidance-primary" id="ui-primary">...</div>
    <div class="guidance-warning" id="ui-warning"></div>
    <div class="guidance-meta">
      <div class="meta-row">
        <span>경로 상태: <strong id="meta-route-mode" style="color: #e2e8f0;">--</strong></span>
        <span>거리: <strong id="meta-distance" style="color: #38bdf8;">--</strong></span>
        <span>계단: <strong id="meta-stairs" style="color: #fbbf24;">--</strong></span>
      </div>
      <div id="meta-replan-reason" style="color: #cbd5e1; font-size: 10px; margin-top: 3px;">재탐색 사유: --</div>
      <div id="meta-unverified" style="color: #94a3b8; font-size: 9.5px; margin-top: 2px;">미확인 항목: --</div>
    </div>
  </div>

  <!-- Three.js Module Import -->
  <script type="module">
    import * as THREE from './js/lib/three.module.js';
    import { HanyangResponseAdapter } from './js/response/HanyangResponseAdapter.js';
    import { ResponseUIAdapter } from './js/response/ResponseUIAdapter.js';
    import { PedestrianRoutingEngine, LINK_STATE } from './js/response/PedestrianRoutingEngine.js';
    import { DATA_PROVENANCE_SOURCE } from './js/response/HanyangBuildingData.js';

    const params = new URLSearchParams(window.location.search);
    const scenario = params.get('scenario') || 'detour'; // 'detour' | 'severed' | 'suspected'

    // Scene & Renderer Setup
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);
    scene.fog = new THREE.FogExp2(0x020408, 0.0015);

    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Subtle ground grid
    const grid = new THREE.GridHelper(600, 60, 0x1e293b, 0x090d16);
    grid.position.set(120, -14, 50);
    scene.add(grid);

    // Initialize HanyangResponseAdapter (3D Scene Layer)
    const hanyangAdapter = new HanyangResponseAdapter({
      scene,
      visualScale: 1.0
    });

    const router = new PedestrianRoutingEngine();

    // Initialize ResponseUIAdapter with router attached
    const uiAdapter = new ResponseUIAdapter({
      hanyangAdapter,
      router,
      onGuidanceUpdate: (g) => {
        document.getElementById('ui-phase-badge').innerText = g.badgeText;
        document.getElementById('ui-headline').innerText = g.phaseHeadline;
        document.getElementById('ui-primary').innerText = g.primaryAction;
        document.getElementById('ui-warning').innerText = g.warnings.length > 0 ? '경고: ' + g.warnings[0] : '';
        document.getElementById('meta-route-mode').innerText = g.routeStatus.displayMode;
        document.getElementById('meta-distance').innerText = g.replanStatus?.totalDistanceMeters ? g.replanStatus.totalDistanceMeters + 'm' : '차단';
        document.getElementById('meta-stairs').innerText = g.replanStatus?.totalStairsDistanceMeters !== undefined ? g.replanStatus.totalStairsDistanceMeters + 'm' : '--';
        document.getElementById('meta-replan-reason').innerText = '재탐색 사유: ' + (g.replanStatus?.replanReason || '기본 최단 경로 유지');
        document.getElementById('meta-unverified').innerText = '미확인 항목: ' + (g.unverifiedItems.join(' · ') || '없음');

        document.getElementById('ui-replan-badge').style.display = g.replanStatus?.isReplanned ? 'inline-block' : 'none';
      }
    });

    // Configure Scenarios
    if (scenario === 'severed') {
      // 2. All routes severed -> Fail-safe shelter-in-place
      document.getElementById('view-title').innerText = 'SEISMOLIVE · P2.4 전체 대피로 차단 및 실내 고립 방어';
      document.getElementById('view-subtitle').innerText = 'Scenario: Shortest Stairs & Detour Ramps Both CLOSED -> Shelter-in-Place Active';

      camera.position.set(135, 68, -12);
      camera.lookAt(50, 9, -75);

      uiAdapter.updateStationMotion(0.01);
      uiAdapter.reportLinkObstacle('NODE_STAIR1_TOP->NODE_STAIR1_BOT', LINK_STATE.CLOSED, {
        source: DATA_PROVENANCE_SOURCE.OFFICIAL_DISASTER_INFO,
        detail: '계단 붕괴'
      });
      uiAdapter.reportLinkObstacle('OSM_NODE_6415394841->NODE_RAMP_MID', LINK_STATE.CLOSED, {
        source: DATA_PROVENANCE_SOURCE.OFFICIAL_DISASTER_INFO,
        detail: '사면 토사 낙하 차단'
      });
    } else if (scenario === 'suspected') {
      // 3. Suspected Hazard on Stair 1 -> 5x penalty diversion
      document.getElementById('view-title').innerText = 'SEISMOLIVE · P2.4 미확인 제보(SUSPECTED) 선제적 우회';
      document.getElementById('view-subtitle').innerText = 'Scenario: Suspected Smoke on Stair 1 -> Dijkstra Cost Penalty Diverts to Step-Free Detour';

      camera.position.set(220, 220, -85);
      camera.lookAt(140, -6, 70);

      uiAdapter.updateStationMotion(0.01);
      uiAdapter.reportLinkObstacle('NODE_STAIR1_TOP->NODE_STAIR1_BOT', LINK_STATE.SUSPECTED, {
        source: DATA_PROVENANCE_SOURCE.USER_FIELD_REPORT,
        detail: '계단 연기 냄새 의심'
      });
    } else {
      // 1. Single link closed on shortest path -> Step-Free Detour (769.1m)
      document.getElementById('view-title').innerText = 'SEISMOLIVE · P2.4 계단 1구간 폐쇄에 따른 무단차 우회로 재탐색';
      document.getElementById('view-subtitle').innerText = 'Scenario: Stair 1 CLOSED -> Dynamic Dijkstra Reroute to 769.1m Step-Free Detour';

      camera.position.set(220, 220, -85);
      camera.lookAt(140, -6, 70);

      uiAdapter.updateStationMotion(0.01);
      uiAdapter.reportLinkObstacle('NODE_STAIR1_TOP->NODE_STAIR1_BOT', LINK_STATE.CLOSED, {
        source: DATA_PROVENANCE_SOURCE.USER_FIELD_REPORT,
        detail: '계단 1구간 잔해 낙하'
      });
    }

    // Render loop
    function render() {
      renderer.render(scene, camera);
    }
    render();

    window.renderComplete = true;
  </script>
</body>
</html>
