<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SEISMOLIVE — P1.2 Spatial Adapter Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #020408;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Nanum Myeongjo", serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #header-overlay {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
    }
    .title {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f8fafc;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }
    .legend-overlay {
      position: absolute;
      bottom: 28px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-line {
      width: 20px;
      height: 2px;
      display: inline-block;
    }
    .badge-provisional {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid #475569;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="header-overlay">
    <div class="title" id="view-title">SEISMOLIVE v4.0 · HANYANG BLDG 212</div>
    <div class="subtitle" id="view-subtitle">Physical ENU Metric Space · Nocturnal Monolith Wireframe <span class="badge-provisional">PROVISIONAL INDOOR</span></div>
  </div>

  <div class="legend-overlay" id="legend-box">
    <div class="legend-item"><span class="legend-line" style="background:#f8fafc;"></span> <span style="color:#e2e8f0;">Selected Floor 3F / Shortest Path (651.9m)</span></div>
    <div class="legend-item"><span class="legend-line" style="background:#f59e0b;"></span> <span style="color:#f59e0b;">Outdoor Staircases (4 flights, 68.5m hazard)</span></div>
    <div class="legend-item"><span class="legend-line" style="background:#64748b;"></span> <span style="color:#94a3b8;">Step-Free Detour (769.1m ramp network)</span></div>
    <div class="legend-item"><span class="legend-line" style="background:#334155;"></span> <span style="color:#64748b;">Ghosted Slabs (1F, 2F, 4F, 5F)</span></div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from './js/lib/three.module.js';
    import { HanyangResponseAdapter } from './js/response/HanyangResponseAdapter.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);
    scene.fog = new THREE.FogExp2(0x020408, 0.002);

    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Subtle ground grid
    const grid = new THREE.GridHelper(600, 60, 0x1e293b, 0x090d16);
    grid.position.set(120, -14, 50);
    scene.add(grid);

    // Initialize Hanyang Response Adapter
    const adapter = new HanyangResponseAdapter({ scene, visualScale: 1.0 });

    // Parse URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const viewMode = urlParams.get('view') || 'building';

    if (viewMode === 'building') {
      document.getElementById('view-title').innerText = 'SEISMOLIVE · 제1공학관 5개 층 및 3F 피난 평면';
      document.getElementById('view-subtitle').innerHTML = 'Axonometric Wireframe · Selected 3F Lecture Hall 301 · SE Stair Core <span class="badge-provisional">PROVISIONAL</span>';
      
      adapter.highlightFloor(3);
      adapter.setRouteDisplay('NONE');

      // Camera focused tightly on Building 212
      camera.position.set(135, 68, -12);
      camera.lookAt(50, 9, -75);
    } else {
      document.getElementById('view-title').innerText = 'SEISMOLIVE · 3F 출구에서 대운동장까지의 피난 경로';
      document.getElementById('view-subtitle').innerHTML = 'Shortest Path (651.9m, 4 Stairs) vs Step-Free Detour (769.1m) <span class="badge-provisional">PARTIALLY VERIFIED</span>';
      
      adapter.highlightFloor(3);
      adapter.setRouteDisplay('ALL');

      // Broad aerial perspective encompassing Bldg 212, paths, and Main Stadium
      camera.position.set(230, 240, -90);
      camera.lookAt(145, -8, 80);
    }

    // Render loop
    function render() {
      renderer.render(scene, camera);
    }
    render();

    // Signal readiness for headless capture
    window.renderComplete = true;
  </script>
</body>
</html>
